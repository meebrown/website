<!DOCTYPE html>
<html lang="en">

        <meta name="viewport" content="width=device-width, initial-scale=1">

    </head>
    <body onload="document.body.style.opacity='1'">

            <div class="shadow1" onclick="abouton()">

            <div class="shadow2" onclick="abouton()">

            </div>

            </div>

                <div id="imgs">
                    <img id="img1" class="mainimgs" src='https://meebrown.github.io/website/SelfPortrait.png' onclick="openArtwork(this)" data-caption="Self-Portrait (2020)&#10;Made with GIMP" alt="Self-Portrait (2020). A being careens through a blue atmosphere with red clouds.">
                    <img id="img2" class="mainimgs" src='https://meebrown.github.io/website/PostHuman.png' onclick="openArtwork(this)" data-caption="Untitled (2022)&#10;Made with Blender, GIMP, and Inkscape" alt="Untitled (2022). A pink creature video calls with a snake-like friend. The friend is using a dog filter over its face.">

        <div id="aboutoverlay" onclick="aboutoff()" role="dialog" aria-modal="true" aria-label="About Matthew Brown" aria-owns="about-close" aria-hidden="true">

        </div>

        </div>

        </button>
        <button class="overlay-close" id="artwork-close" type="button" data-effects-clean-control hidden aria-label="Close artwork" aria-controls="artwork-viewer">

        </button>
    <style id="page-styles">
        html, body, body * { cursor: auto !important; }
        a[href], a[href] *, button, button *, [role="button"] { cursor: pointer !important; }

        .overlay-close {
            position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; padding: 10px;
            border: 0; border-radius: 4px; background: transparent;
        }
        [data-effects-clean-control] { position: fixed; z-index: 60; }
        [data-effects-clean-control][hidden] { display: none !important; }
        .mainimgs:focus-visible { outline-color: #fff; }
        .overlay-close img { display: block; width: 24px; height: 24px; filter: none; }
        .overlay-close:focus-visible { outline: 2px solid #555; outline-offset: 3px; }


        p{
            font-family: 'Helvetica', 'Arial', sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            cursor: default;
            opacity: 0;
            transition: opacity 1s;
        }

        a {
            cursor: none;
        }

        .mainimgs{
            height: min(90vh, calc(90vw / var(--gallery-aspect-ratio)));
            width:auto;
            flex: none;
            filter: none;
            display: block;
            position: relative;
            outline: 2px solid transparent;
            outline-offset: -2px;
            transition: outline-color 160ms ease;
            z-index: 0;
        }

        #imgs {
            /* Sum of the two artworks' natural width-to-height ratios. */
            --gallery-aspect-ratio: 1.7705882353;
            position: fixed;
            inset: 10vh 5vw;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            font-size: 0;
        }

        .mainimgs:hover, .mainimgs[data-effects-hover] {
            outline-color: #fff;
            z-index: 1;
            cursor: pointer;
        }

        @media (prefers-reduced-motion: reduce) {
            .mainimgs { transition: none; }
        }

        #editor-section{
            width: 100vw;
            height: 100vh;
            position:relative;
            margin: 0;
            padding: 0;
        }
        
        #editor {
            width: 100vw;
            height: 100vh;
            z-index: 10;
            position: absolute;
            left: 0;
            top: 0;
        }

        #menu {
            position: fixed;
            z-index: 20;
        }

        #aboutoverlay {
            position: fixed;
            display: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255);
            z-index: 25;
            cursor: url("https://meebrown.github.io/website/clickX.png") 13 13, auto;
        }

        #aboutp {
            margin: 0;
            top: 50%;
            left: 50%;
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            font-size: 3vh;
            position: absolute;
        }
        
        #aboutp a {
            cursor: pointer;
        }

        .dropdown {
            position: fixed;
            z-index: 23;
            animation: x 30s linear infinite alternate;
            cursor: none;
            -webkit-transform-origin: center center;
            border: none;
            animation-delay: 200ms;
        }
        
        .dropbtn {
          font-size: 10vh;
          animation: y 24s linear infinite alternate;
          background-color: transparent;
          -webkit-transform-origin: center center;
          border: none;
          height: 12vh;
          width: 12vh;
          line-height: 6vh;
          opacity: 0.2;
          position: absolute;
          cursor: pointer;
          animation-delay: 200ms;
        }
        
        
        .shadow1 {
            position: fixed;
            z-index: 22;
            animation: x 30s linear infinite alternate;
            cursor: none;
            -webkit-transform-origin: center center;
            border: none;
            animation-delay: 220ms;
        }
        
        .shadow1btn {
          font-size: 10vh;
          opacity: 0.15;
          animation: y 24s linear infinite alternate;
          background-color: transparent;
          cursor: pointer;
          -webkit-transform-origin: center center;
          border: none;
          animation-delay: 220ms;
          height: 12vh;
          width: 12vh;
          line-height: 6vh;
        }
        
        .shadow2 {
            position: fixed;
            z-index: 22;
            animation: x 30s linear infinite alternate;
            cursor: none;
            -webkit-transform-origin: center center;
            border: none;
            animation-delay: 240ms;
        }
        
        .shadow2btn {
          font-size: 10vh;
          opacity: 0.1;
          animation: y 24s linear infinite alternate;
          background-color: transparent;
          cursor: pointer;
          -webkit-transform-origin: center center;
          border: none;
          animation-delay: 240ms;
          height: 12vh;
          width: 12vh;
          line-height: 6vh;
        }
        
        .shadow3 {
            position: fixed;
            z-index: 22;
            animation: x 30s linear infinite alternate;
            cursor: none;
            -webkit-transform-origin: center center;
            border: none;
            animation-delay: 260ms;
        }
        
        .shadow3btn {
          font-size: 10vh;
          opacity: 0.05;
          animation: y 24s linear infinite alternate;
          background-color: transparent;
          cursor: pointer;
          -webkit-transform-origin: center center;
          border: none;
          animation-delay: 260ms;
          height: 12vh;
          width: 12vh;
          line-height: 6vh;
        }
        
        #spin {
            animation-name: spin;
            animation-duration: 5000ms;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }

        @keyframes x {
          75% {
              transform: translateX(calc(96vw - 0.5vw));
          }
          100%{
              transform: none;
          }
        }

        @keyframes y {
          75% {
              transform: translateY(calc(90vh - 0.5vh)) rotate(720deg);
          }
          100% {
              transform: none;
          }
        }
        
        
        .dropbtn:hover {
            cursor: pointer;
            opacity: 1;
        }
        

    </style>

    <script>
        
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                window.location.href = "mobile1.html";
        }
        
        let aboutFocus = null;
        function abouton() {
            const panel = document.getElementById('aboutoverlay');
            if (panel.style.display === 'block') return;
            aboutFocus = document.activeElement;
            panel.style.display = 'block';
            panel.setAttribute('aria-hidden', 'false');
            document.getElementById('about-close').hidden = false;
            document.getElementById('about-close').focus({ preventScroll: true });
        }

        function aboutoff() {
            const panel = document.getElementById('aboutoverlay');
            panel.style.display = 'none';
            panel.setAttribute('aria-hidden', 'true');
            document.getElementById('about-close').hidden = true;
            if (aboutFocus?.isConnected) aboutFocus.focus({ preventScroll: true });
        }

        document.addEventListener('keydown', event => {
            const panel = document.getElementById('aboutoverlay');
            if (panel.style.display !== 'block') return;
            if (event.key === 'Escape') {
                event.preventDefault();
                aboutoff();
            } else if (event.key === 'Tab') {
                const controls = [document.getElementById('about-close'), ...panel.querySelectorAll('a[href]')];
                const index = controls.indexOf(document.activeElement);
                event.preventDefault();
                controls[(index + (event.shiftKey ? -1 : 1) + controls.length) % controls.length].focus();
            }
        });
    </script>
    <style>
        #interaction-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .distortion-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        @media (prefers-reduced-motion: reduce) {
            #interaction-overlay { display: none; }
            .dropdown, .dropbtn, .shadow1, .shadow1btn, .shadow2, .shadow2btn, .shadow3, .shadow3btn {
                animation: none;
            }
        }
    </style>
    <style id="viewer-styles">
        #artwork-viewer { position: fixed; inset: 0; z-index: 40; overflow: hidden; cursor: default; }
        #artwork-viewer[hidden] { display: none; }
        .viewer-backdrop { position: absolute; inset: 0; background: white; opacity: 0; }
        #viewer-image {
            position: fixed; left: 0; top: 0; margin: 0; max-width: none;
            transform-origin: 0 0; will-change: transform; filter: none; cursor: default;
        }
        #viewer-caption {
            position: absolute; bottom: 18px; left: 0; width: 100%; margin: 0;
            text-align: center; font-size: 2vh; line-height: 1.4; white-space: pre-line;
            opacity: 0; pointer-events: none;
        }
        #artwork-close { opacity: 0; }
    </style>
