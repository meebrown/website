<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Matthew Brown</title>
    </head>
    <body onload="document.body.style.opacity='1'">
        <div id="page-content" data-viewer-side-margin="20" data-effects-input="touch" data-effects-scope="all" data-smudge-width-scale="0.5625" data-smudge-strength-scale="1.05" data-tap-radius-scale="0.8" data-tap-strength-scale="3">
        <div class="qmks" onclick="abouton()">
            <div class="dropdown">
                <button class="dropbtn" onclick="abouton()"><span class="question-glyph">?</span></button>
                <!--<button class="aboutword" onclick="abouton()">About</button>-->
            </div>
            <div class="shadow1" onclick="abouton()">
                <button class="shadow1btn"><span class="question-glyph">?</span></button>
            </div>
            <div class="shadow2" onclick="abouton()">
                <button class="shadow2btn"><span class="question-glyph">?</span></button>
            </div>
        </div>
        <div id="editor-section">
            <div class="editable" id="editor">
                <div id="imgs">
                    <img id="img1" class="mainimgs" src='https://meebrown.github.io/website/SelfPortrait.png' onclick="openArtwork(this)" data-caption="Self-Portrait (2020)&#10;Made with GIMP" alt="Self-Portrait (2020). A being careens through a blue atmosphere with red clouds.">
                    <img id="img2" class="mainimgs" src='https://meebrown.github.io/website/PostHuman.png' onclick="openArtwork(this)" data-caption="Untitled (2022)&#10;Made with Blender, GIMP, and Inkscape" alt="Untitled (2022). A pink creature video calls with a snake-like friend. The friend is using a dog filter over its face.">
                </div>
            </div>
        </div>
        <div id="aboutoverlay" onclick="aboutoff()" role="dialog" aria-modal="true" aria-label="About Matthew Brown" aria-hidden="true">
            <button id="about-close" class="overlay-close" type="button" aria-label="Close information" onclick="event.stopPropagation(); aboutoff()">
                <img src="clickX.png" width="24" height="24" alt="">
            </button>
            <p id="aboutp" onclick="event.stopPropagation()">Matthew Brown<br><br>Email: <a href="mailto:meeb1998@gmail.com">meeb1998@gmail.com</a><br>Instagram: <a href="https://www.instagram.com/mattheweebrown/">@mattheweebrown</a></p>
        </div>
        </div>
        <div id="interaction-overlay" aria-hidden="true" inert></div>
        <div id="artwork-viewer" role="dialog" aria-modal="true" aria-label="Artwork viewer" hidden>
            <div class="viewer-backdrop"></div>
            <img id="viewer-image" alt="">
            <p id="viewer-caption"></p>
            <button class="overlay-close" id="artwork-close" type="button" aria-label="Close artwork">
                <img src="clickX.png" width="24" height="24" alt="">
            </button>
        </div>
    <style id="page-styles">
        html { touch-action: pinch-zoom; overscroll-behavior: none; scroll-behavior: auto; }
        html[data-scroll-zoomed] { touch-action: auto; }
        body { overscroll-behavior: none; }
        /* Keep the filtered source bounded to the viewport on mobile Safari. */
        .distortion-scene { overflow: hidden; }
        html, body, body * { cursor: none !important; }
        a[href] { cursor: pointer !important; }
        html[data-link-cursor="false"] body * { cursor: none !important; }
        html[data-link-cursor="true"], html[data-link-cursor="true"] body * { cursor: pointer !important; }

        .overlay-close {
            position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; padding: 10px;
            border: 0; border-radius: 4px; background: transparent;
        }
        .overlay-close img { display: block; width: 24px; height: 24px; filter: none; }
        .overlay-close:focus-visible { outline: 2px solid #555; outline-offset: 3px; }


        p{
            font-family: 'Helvetica', 'Arial', sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            cursor: none;
            opacity: 0;
            transition: opacity 1s;
        }

        a {
            cursor: none;
        }

        #imgs {
            margin: 0;
            font-size: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        
        #imgs img {
            width: 100%;
            height: auto;
        }

        #editor-section{
            width: 100%;
            min-height: 100vh;
            position: relative;
            margin: 0;
            padding: 0;
        }
        
        #editor {
            width: 100%;
            z-index: 10;
            position: relative;
            left: 0;
            top: 0;
        }

        #menu {
            position: fixed;
            z-index: 20;
        }

        #aboutoverlay {
            position: fixed;
            display: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255);
            z-index: 25;
            cursor: url("https://meebrown.github.io/website/clickX.png") 13 13, auto;
        }

        #aboutp {
            margin: 0;
            top: 50%;
            left: 50%;
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            font-size: 3vh;
            position: absolute;
        }
        
        #aboutp a {
            cursor: pointer;
        }

        .dropdown {
            position: fixed;
            z-index: 23;
            animation: x 30s linear infinite alternate;
            cursor: none;
            -webkit-transform-origin: center center;
            border: none;
            animation-delay: 200ms;
        }
        
        .dropbtn {
          font-size: 10vh;
          animation: y 24s linear infinite alternate;
          background-color: transparent;
          -webkit-transform-origin: center center;
          border: none;
          height: 12vh;
          line-height: 6vh;
          opacity: 1;
          position: absolute;
          cursor: pointer;
          animation-delay: 200ms;
          color: #000;
        }
        
        .aboutword {
            animation: yabout 24s linear infinite alternate;
            font-size: 3vh;
            opacity: 1;
            cursor: none;
            text-align: center;
            position: relative;
            background-color: transparent;
            border: none;
            top: 10vh;
            left: 3vh;
            animation-delay: 200ms;
            color: #000;
        }
        
        .shadow1 {
            position: fixed;
            z-index: 22;
            animation: x 30s linear infinite alternate;
            cursor: none;
            -webkit-transform-origin: center center;
            border: none;
            animation-delay: 230ms;
        }
        
        .shadow1btn {
          font-size: 10vh;
          opacity: 0.50;
          animation: y 24s linear infinite alternate;
          background-color: transparent;
          cursor: pointer;
          -webkit-transform-origin: center center;
          border: none;
          animation-delay: 230ms;
          height: 12vh;
          line-height: 6vh;
          color: #000;
        }
        
        .shadow2 {
            position: fixed;
            z-index: 22;
            animation: x 30s linear infinite alternate;
            cursor: none;
            -webkit-transform-origin: center center;
            border: none;
            animation-delay: 260ms;
        }
        
        .shadow2btn {
          font-size: 10vh;
          opacity: 0.25;
          animation: y 24s linear infinite alternate;
          background-color: transparent;
          cursor: pointer;
          -webkit-transform-origin: center center;
          border: none;
          animation-delay: 260ms;
          height: 12vh;
          line-height: 6vh;
          color: #000;
        }
        
        #spin {
            animation-name: spin;
            animation-duration: 5000ms;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }

        /* Move the button box to the viewport edges; rotate only its glyph. */
        #page-content {
            --question-size: min(12vh, 100vw, 100vh);
            --question-travel-x: max(0px, calc(100vw - var(--question-size)));
            --question-travel-y: max(0px, calc(100vh - var(--question-size)));
        }
        @supports (height: 100dvh) {
            #page-content {
                --question-size: min(12dvh, 100dvw, 100dvh);
                --question-travel-x: max(0px, calc(100dvw - var(--question-size)));
                --question-travel-y: max(0px, calc(100dvh - var(--question-size)));
            }
        }
        .qmks > div {
            left: 0; top: 0;
            width: var(--question-size); height: var(--question-size);
        }
        .qmks > div > button {
            position: absolute; left: 0; top: 0;
            width: var(--question-size); height: var(--question-size);
            margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: calc(var(--question-size) * 5 / 6); line-height: 1;
            overflow: hidden;
        }
        .question-glyph {
            display: inline-block; line-height: 1; pointer-events: none;
            animation: question-turn 24s linear infinite alternate;
            animation-delay: inherit;
        }
        @keyframes question-turn {
            0%, 100% { transform: rotate(0deg); }
            75% { transform: rotate(720deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .question-glyph { animation: none; }
        }

        @keyframes x {
          75% {
              transform: translateX(var(--question-travel-x));
          }
          100%{
              transform: none;
          }
        }

        @keyframes y {
          75% {
              transform: translateY(var(--question-travel-y));
          }
          100% {
              transform: none;
          }
        }
        
        @keyframes yabout {
          75% {
              transform: translateY(calc(90vh - 0.5vh));
          }
          100% {
              transform: none;
          }
        }

    </style>

    <script>
        let aboutFocus = null;
        function abouton() {
            const panel = document.getElementById('aboutoverlay');
            if (panel.style.display === 'block') return;
            aboutFocus = document.activeElement;
            panel.style.display = 'block';
            panel.setAttribute('aria-hidden', 'false');
            document.getElementById('about-close').focus({ preventScroll: true });
        }

        function aboutoff() {
            const panel = document.getElementById('aboutoverlay');
            panel.style.display = 'none';
            panel.setAttribute('aria-hidden', 'true');
            if (aboutFocus?.isConnected) aboutFocus.focus({ preventScroll: true });
        }

        document.addEventListener('keydown', event => {
            const panel = document.getElementById('aboutoverlay');
            if (panel.style.display !== 'block') return;
            if (event.key === 'Escape') {
                event.preventDefault();
                aboutoff();
            } else if (event.key === 'Tab') {
                const controls = [...panel.querySelectorAll('button, a[href]')];
                const first = controls[0], last = controls[controls.length - 1];
                if (event.shiftKey && (document.activeElement === first || !panel.contains(document.activeElement))) {
                    event.preventDefault(); last.focus();
                } else if (!event.shiftKey && (document.activeElement === last || !panel.contains(document.activeElement))) {
                    event.preventDefault(); first.focus();
                }
            }
        });
    </script>
    <style>
        #interaction-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            overflow: hidden;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .distortion-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        @media (prefers-reduced-motion: reduce) {
            #interaction-overlay { display: none; }
            .dropdown, .dropbtn, .aboutword, .shadow1, .shadow1btn, .shadow2, .shadow2btn {
                animation: none;
            }
        }
    </style>
    <style id="viewer-styles">
        #artwork-viewer { position: fixed; inset: 0; z-index: 40; overflow: hidden; cursor: default; touch-action: pinch-zoom; overscroll-behavior: contain; }
        #artwork-viewer[hidden] { display: none; }
        .viewer-backdrop { position: absolute; inset: 0; background: white; opacity: 0; }
        #viewer-image {
            position: fixed; left: 0; top: 0; margin: 0; max-width: none;
            transform-origin: 0 0; will-change: transform; filter: none; cursor: default;
        }
        #viewer-caption {
            position: absolute; bottom: 18px; left: 0; width: 100%; margin: 0;
            text-align: center; font-size: clamp(12px, 2vh, 16px); line-height: 1.4; white-space: pre-line;
            opacity: 0; pointer-events: none;
        }
        #artwork-close { opacity: 0; }
    </style>
